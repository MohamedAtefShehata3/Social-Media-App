<nav class="sticky top-0 z-50 backdrop-blur-xl transition-colors duration-200
         bg-white/85 dark:bg-[#0f1420]/90
         border-b border-gray-100 dark:border-gray-800/60
         relative">

    <!-- top accent line -->
    <div class="absolute top-0 left-0 right-0 h-[2px] bg-brand-gradient opacity-80"></div>

    <div class="max-w-screen-xl mx-auto px-4 lg:px-6">
        <div class="flex items-center justify-between h-[70px]">

            <!-- ===== Logo ===== -->
            <a routerLink="/feed" class="flex items-center gap-3 shrink-0 no-underline group">
                <div class="relative">
                    <div
                        class="absolute inset-0 bg-brand-gradient rounded-2xl blur-md opacity-40 group-hover:opacity-70 transition-opacity duration-300">
                    </div>
                    <img src="assets/route.png" alt="Route Logo"
                        class="relative w-10 h-10 rounded-2xl object-cover shadow-card" />
                </div>
                <span class="font-extrabold text-xl tracking-tight hidden sm:block
                       bg-clip-text text-transparent bg-brand-gradient">
                    Route<span class="text-brand-amber">.</span>
                </span>
            </a>

            <!-- ===== Center nav links ===== -->
            <div class="hidden md:flex items-center gap-1 p-1.5 rounded-pill
               bg-gray-50/80 dark:bg-white/5 border border-gray-100 dark:border-gray-800">

                <a routerLink="/feed" routerLinkActive="bg-brand-gradient text-white shadow-card"
                    [routerLinkActiveOptions]="{ exact: false }" class="no-underline flex items-center gap-2 px-5 py-2.5 rounded-pill text-sm font-semibold transition-all duration-200
                    text-gray-500 hover:text-gray-800 dark:text-gray-400 dark:hover:text-gray-100">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24"
                        stroke-width="2" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
                    </svg>
                    Feed
                </a>

                <a routerLink="/profile" routerLinkActive="bg-brand-gradient text-white shadow-card" class="no-underline flex items-center gap-2 px-5 py-2.5 rounded-pill text-sm font-semibold transition-all duration-200
                    text-gray-500 hover:text-gray-800 dark:text-gray-400 dark:hover:text-gray-100">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24"
                        stroke-width="2" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                    </svg>
                    Profile
                </a>

                <a routerLink="/notifications" routerLinkActive="bg-brand-gradient text-white shadow-card" class="no-underline flex items-center gap-2 px-5 py-2.5 rounded-pill text-sm font-semibold transition-all duration-200
                    text-gray-500 hover:text-gray-800 dark:text-gray-400 dark:hover:text-gray-100">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24"
                        stroke-width="2" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M15 17h5l-1.4-1.4A2 2 0 0118 14.2V11a6 6 0 00-4-5.66V5a2 2 0 10-4 0v.34A6 6 0 006 11v3.2a2 2 0 01-.6 1.4L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" />
                    </svg>
                    Notifications
                </a>
            </div>

            <!-- ===== Right side ===== -->
            <div class="flex items-center gap-2">

                <!-- Notification bell (mobile/quick access) -->
                <button type="button" class="relative w-10 h-10 rounded-full flex items-center justify-center transition-colors duration-200
                 text-gray-500 hover:bg-gray-100 dark:text-gray-300 dark:hover:bg-white/5">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24"
                        stroke-width="2" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M15 17h5l-1.4-1.4A2 2 0 0118 14.2V11a6 6 0 00-4-5.66V5a2 2 0 10-4 0v.34A6 6 0 006 11v3.2a2 2 0 01-.6 1.4L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" />
                    </svg>
                    <span
                        class="absolute top-2 right-2 w-2 h-2 rounded-full bg-brand-pink ring-2 ring-white dark:ring-[#0f1420]"></span>
                </button>

                <!-- Theme toggle -->
                <button (click)="toggleTheme()" type="button" class="w-10 h-10 rounded-full flex items-center justify-center transition-colors duration-200
                 text-gray-500 hover:bg-gray-100 dark:text-brand-amber dark:hover:bg-white/5">
                    @if (!isDarkMode) {
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24"
                        stroke-width="2" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
                    </svg>
                    } @else {
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24"
                        stroke-width="2" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
                    </svg>
                    }
                </button>

                <div class="w-px h-6 bg-gray-200 dark:bg-gray-700 mx-1 hidden sm:block"></div>

                <!-- User dropdown -->
                <button id="user-menu-button" data-dropdown-toggle="user-dropdown" type="button" class="flex items-center gap-2 pl-1 pr-2.5 py-1 rounded-pill transition-colors duration-200
                 hover:bg-gray-100 dark:hover:bg-white/5">

                    <img [src]="(userImage && !imgError) ? userImage : 'assets/default-profile.png'" [alt]="userName"
                        (error)="imgError = true"
                        class="w-9 h-9 rounded-full object-cover ring-2 ring-brand-purple/30" />

                    <span class="hidden sm:block text-sm font-semibold text-gray-700 dark:text-gray-100">
                        {{ userName }}
                    </span>
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5 text-gray-400" fill="none"
                        viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" />
                    </svg>
                </button>

                <!-- Dropdown menu (Flowbite) -->
                <div id="user-dropdown" class="z-50 hidden text-sm rounded-card shadow-card w-48 overflow-hidden
                 bg-white border border-gray-100 dark:bg-[#1a2233] dark:border-gray-700">
                    <ul class="py-1.5">
                        <li>
                            <a routerLink="/profile" class="no-underline flex items-center gap-2 px-4 py-2.5 text-gray-700 hover:bg-gray-50 dark:text-gray-200
                                dark:hover:bg-white/5">
                                <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24"
                                    stroke-width="2" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round"
                                        d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                                </svg>
                                My Profile
                            </a>
                        </li>
                        <li class="border-t border-gray-100 dark:border-gray-700 mt-1 pt-1">
                            <button (click)="logOut()" type="button"
                                class="w-full flex items-center gap-2 text-left px-4 py-2.5 font-medium text-danger hover:bg-red-50 dark:hover:bg-red-900/20">
                                <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24"
                                    stroke-width="2" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round"
                                        d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
                                </svg>
                                Log out
                            </button>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </div>
</nav>
