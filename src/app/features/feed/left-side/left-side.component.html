<aside class="rounded-2xl border shadow-sm overflow-hidden sticky top-24 transition-colors duration-200
         bg-[#ffffff] border-gray-100 dark:bg-[#1a2233] dark:border-gray-700">

    <!-- ===== Profile header ===== -->
    <div class="relative">
        <div class="h-20 bg-brand-gradient"></div>
        <div class="absolute inset-x-0 top-0 h-20 opacity-30"
            style="background: radial-gradient(circle at 80% 20%, #EF9F27 0%, transparent 55%);"></div>

        <div class="px-5 pb-4 -mt-9 flex flex-col items-center text-center">
            <img [src]="(userImage && !imgError) ? userImage : 'assets/default-profile.png'" [alt]="userName"
                (error)="imgError = true"
                class="w-[72px] h-[72px] rounded-full object-cover ring-4 ring-[#ffffff] dark:ring-[#1a2233] shadow-card" />
            <h3 class="mt-2 font-bold text-[15px] text-gray-800 dark:text-gray-100 truncate max-w-full">
                {{ userName || 'Welcome' }}
            </h3>
            <span class="text-xs text-gray-400 dark:text-gray-500">Route Posts member</span>
        </div>
    </div>

    <!-- ===== Navigation ===== -->
    <nav class="px-3 pb-3 border-t border-gray-100 dark:border-gray-700 pt-3">
        <ul class="space-y-1">
            @for (item of navItems; track item.route) {
            <li>
                <a [routerLink]="item.route" routerLinkActive #rla="routerLinkActive"
                    class="no-underline group flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-semibold transition-all duration-200"
                    [class]="rla.isActive
                        ? 'bg-brand-purple/10 text-brand-purple-dark dark:bg-brand-purple/20 dark:text-brand-purple-light'
                        : 'text-gray-600 hover:bg-gray-50 hover:translate-x-0.5 dark:text-gray-300 dark:hover:bg-white/5'">

                    <span
                        class="w-9 h-9 rounded-lg flex items-center justify-center shrink-0 transition-all duration-200"
                        [class]="rla.isActive
                            ? 'bg-brand-gradient text-white shadow-card'
                            : 'bg-gray-100 text-gray-500 group-hover:bg-brand-purple/10 group-hover:text-brand-purple dark:bg-white/5 dark:text-gray-400'">
                        <svg xmlns="http://www.w3.org/2000/svg" class="w-[18px] h-[18px]" fill="none"
                            viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" [attr.d]="item.icon" />
                        </svg>
                    </span>

                    <span class="flex-1">{{ item.label }}</span>

                    @if (rla.isActive) {
                    <span class="w-1.5 h-1.5 rounded-full bg-brand-pink"></span>
                    }
                </a>
            </li>
            }
        </ul>
    </nav>
</aside>
