<div class="relative flex min-h-screen items-center justify-center overflow-hidden px-4 py-8
         bg-gradient-to-br from-brand-purple-light/20 via-white to-brand-pink-light/20
         dark:from-slate-950 dark:via-slate-900 dark:to-slate-950">
    <!-- Decorative blobs -->
    <div
        class="pointer-events-none absolute -left-24 -top-24 h-80 w-80 rounded-full bg-brand-gradient opacity-20 blur-3xl">
    </div>
    <div
        class="pointer-events-none absolute -bottom-24 -right-24 h-80 w-80 rounded-full bg-brand-gradient opacity-20 blur-3xl">
    </div>

    <!-- Floating icons -->
    <i
        class="fa-regular fa-comment pointer-events-none absolute left-[12%] top-[20%] animate-bounce text-3xl text-brand-purple/30"></i>
    <i
        class="fa-regular fa-heart pointer-events-none absolute right-[14%] top-[28%] animate-pulse text-3xl text-brand-pink/40"></i>
    <i
        class="fa-regular fa-bell pointer-events-none absolute bottom-[22%] left-[18%] animate-pulse text-2xl text-brand-purple/30"></i>
    <i
        class="fa-regular fa-image pointer-events-none absolute bottom-[26%] right-[16%] animate-bounce text-2xl text-brand-pink/30"></i>

    <!-- Card -->
    <div class="relative w-full max-w-lg rounded-card border border-gray-100 bg-white/90 p-8 text-center shadow-card backdrop-blur
           sm:p-12 dark:border-slate-700 dark:bg-slate-900/90">
        <!-- Logo -->
        <div class="mx-auto mb-6 flex w-fit items-center gap-2">
            <div class="flex h-10 w-10 items-center justify-center rounded-xl bg-brand-gradient">
                <i class="fa-solid fa-bolt text-lg text-white"></i>
            </div>
            <span class="text-2xl font-extrabold text-brand-purple-dark dark:text-white">
                Social<span class="text-brand-pink">App</span>
            </span>
        </div>

        <!-- 404 -->
        <h1
            class="select-none bg-brand-gradient bg-clip-text text-8xl font-black leading-none text-transparent sm:text-9xl">
            404
        </h1>

        <h2 class="mt-4 text-2xl font-extrabold text-gray-800 dark:text-white">Lost in the feed? 🧭</h2>
        <p class="mx-auto mt-2 max-w-sm text-sm text-gray-400 dark:text-slate-400">
            The page you're looking for doesn't exist, was moved, or the link is broken.
        </p>

        <!-- Actions -->
        <div class="mt-8 flex flex-col gap-3 sm:flex-row sm:justify-center">
            <a routerLink="/feed" class="flex items-center justify-center gap-2 rounded-pill bg-brand-gradient px-8 py-3 font-bold text-white shadow-card
               transition hover:opacity-90 active:scale-[0.98]">
                <i class="fa-solid fa-house"></i>
                <span>Back to feed</span>
            </a>
            <a routerLink="/login" class="flex items-center justify-center gap-2 rounded-pill border border-gray-200 px-8 py-3 font-semibold
               text-gray-600 transition hover:bg-gray-50 active:scale-[0.98]
               dark:border-slate-700 dark:text-slate-200 dark:hover:bg-slate-800">
                <i class="fa-solid fa-right-to-bracket"></i>
                <span>Log in</span>
            </a>
        </div>
    </div>
</div>
